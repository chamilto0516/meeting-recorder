[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-recorder"
version = "0.2.1"
description = "Local meeting recorder for Linux (PipeWire + FFmpeg capture, faster-whisper transcription, LiteLLM/Ollama summarization)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.0.0",
    "litellm>=1.40.0",
    "PyYAML>=6.0",
]

[project.scripts]
meeting-recorder = "meeting_recorder.cli:main"
meeting-recorder-panel = "meeting_recorder_panel.app:main"

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[tool.setuptools.packages.find]
where = [".", "gui"]
include = ["meeting_recorder*", "meeting_recorder_panel*"]

[tool.setuptools.package-data]
meeting_recorder = ["modes/*.md", "modes/*.yaml"]
